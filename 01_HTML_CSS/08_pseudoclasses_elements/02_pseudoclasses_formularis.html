<!DOCTYPE html>
<html lang="ca">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Pseudoclasses Formularis (Required, Focus, Checked, Disabled)</title>
    <meta name="description"
      content="Pseudoclasses dels formularis requerit, en focus, seleccionat i deshabilitat amb diferents exemples.">
    <link rel="icon" href="./img/favicon.ico">
    <link rel="stylesheet" href="./css/pseudoclasses_formularis.css">
  </head>
  <body>
    <h2>Pseudoclasses en formularis (required, focus, checked, disabled)</h2>
    <form>
      <label>
        Camp obligatori* (required):
        <input type="text" required placeholder="Camp obligatori">
      </label>
      <label>
        Activa estils al fer clic (focus):
        <input type="email" placeholder="Fes clic sobre l'input">
      </label>
      <label>
        Activa estils al seleccionar el checkbox (checked):
        <input type="checkbox">
      </label>
      <label>
        Element desactivat (disabled):
        <input type="text" value="Desactivat" disabled>
      </label>
    </form>
  </body>
</html>
