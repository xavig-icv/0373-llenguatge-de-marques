<!DOCTYPE html>
<html lang="ca">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Propietat Font Size</title>
    <meta name="description" content="Propietat Mida del text amb diferents exemples.">
    <link rel="icon" href="./img/favicon.ico">
    <link rel="stylesheet" href="./css/propietat_font_size.css">
  </head>
  <body>
    <h2>Propietat: Mida del Text (font-size)</h2>
    <p class="font-px">Text amb mida en PX (unitat absoluta).</p>
    <p class="font-em">Text amb mida en EM (relativa al pare).</p>
    <p class="font-rem">Text amb mida en REM (relativa a l'arrel HTML).</p>
    <p class="font-vw">Text amb mida en VW (relativa a l'amplada de la finestra).</p>
  </body>
</html>
