<!DOCTYPE html>
<html lang="ca">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Propietat Word Spacing</title>
    <meta name="description" content="Propietat Espai entre paraules amb diferents exemples.">
    <link rel="icon" href="./img/favicon.ico">
    <link rel="stylesheet" href="./css/propietat_word_spacing.css">
  </head>
  <body>
    <h2>Propietat: espai entre paraules (word-spacing)</h2>
    <p class="word-normal">El text disposa d'un espai entre paraules per defecte. (normal ó 0px)</p>
    <p class="word-04">El text no disposa d'espai entre paraules. (-4px)</p>
    <p class="word-8">El text disposa del doble d'espai entre paraules del normal. (8px)</p>
    <p class="word-16">El text disposa d'un espai de paraules molt grant. (16px)</p>
  </body>
</html>
