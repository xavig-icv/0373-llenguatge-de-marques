<!DOCTYPE html>
<html lang="ca">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Propietat Text Transform</title>
    <meta name="description" content="Propietat Transformació del text amb diferents exemples.">
    <link rel="icon" href="./img/favicon.ico">
    <link rel="stylesheet" href="./css/propietat_text_transform.css">
  </head>
  <body>
    <h2>Propietat: transformació del text (text-transform)</h2>
    <p class="transform-uppercase">El text es mostrarà TOT EN MAJÚSCULES. (uppercase)</p>
    <p class="transform-lowercase">El text es mostrarà tot en MINÚSCULES. (lowercase)</p>
    <p class="transform-capitalize">El text mostrarà cada lletra d'inici de Paraula En Majúscula.
      (capitalize)</p>
    <p class="transform-none">El text es MOSTRA sense cap Transformació. (none)</p>
  </body>
</html>
