<!DOCTYPE html>
<html lang="ca">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Propietat: Animation i @keyframes</title>
    <meta name="description"
      content="Propietat crear animacions automàtiques d'elements amb diferents exemples.">
    <link rel="icon" href="./img/favicon.ico">
    <link rel="stylesheet" href="./css/propietat_animation.css">
  </head>
  <body>
    <section>
      <h2>Propietat: Animar automàticament elements (animation i @keyframes) </h2>
      <div class="card animacio-color-fons">Fons de colors</div>
      <div class="card animacio-pulse">Batec (Pulse)</div>
      <div class="card animacio-flip">Flip 3D</div>
      <div class="card animacio-float">Flotant</div>
      <div class="card animacio-progress">
        <div class="progress-bar">Barra de Progrés</div>
      </div>
      <div class="card animacio-blur">
        <div class="mini-box moviment-animation"></div>Element Animat
      </div>
      <div class="card-runner">
        <div class="runner"></div>
      </div>
    </section>
