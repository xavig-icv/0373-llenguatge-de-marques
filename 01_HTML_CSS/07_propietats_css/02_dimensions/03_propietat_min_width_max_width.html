<!DOCTYPE html>
<html lang="ca">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Propietats Min Width i Max Width</title>
    <meta name="description"
      content="Propietat Amplada mínima i màxima d'un element amb diferents exemples.">
    <link rel="icon" href="./img/favicon.ico">
    <link rel="stylesheet" href="./css/propietat_min_width_max_width.css">
  </head>
  <body>
    <h2>Propietat: amplada mínima i màxima (min-width i max-width)</h2>
    <div class="minmax-width-px">Mida mínima i màxima fixa (300px i 600px)</div>
    <div class="minmax-width-percent">Mida mínima i màxima variable respecte el pare (40% i 80%)
    </div>
    <div class="minmax-width-vw">Mida mínima i màxima variable respecte la pantalla (40vw i 50vw)
    </div>
  </body>
