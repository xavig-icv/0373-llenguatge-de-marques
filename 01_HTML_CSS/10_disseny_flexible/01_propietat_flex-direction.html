<!DOCTYPE html>
<html lang="ca">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Propietat Flex-Direction</title>
    <meta name="description"
      content="Propietat direcció dels elements flexibles amb diferents exemples.">
    <link rel="icon" href="./img/favicon.ico">
    <link rel="stylesheet" href="./css/propietat_flex-direction.css">
  </head>
  <body>
    <h2>Propietat: direcció dels elements flexibles (flex-direction)</h2>
    <h3>Row (fila horitzontal per defecte)</h3>
    <div class="flex flex-row">
      <div class="flex-item">1</div>
      <div class="flex-item">2</div>
      <div class="flex-item">3</div>
    </div>
    <h3>Row Reverse (fila horitzontal invertida)</h3>
    <div class="flex flex-row-reverse">
      <div class="flex-item">1</div>
      <div class="flex-item">2</div>
      <div class="flex-item">3</div>
    </div>
    <h3>Column (columna vertical)</h3>
    <div class="flex flex-column">
      <div class="flex-item">1</div>
      <div class="flex-item">2</div>
      <div class="flex-item">3</div>
    </div>
    <h3>Column Reverse (columna vertical invertida)</h3>
    <div class="flex flex-column-reverse">
      <div class="flex-item">1</div>
      <div class="flex-item">2</div>
      <div class="flex-item">3</div>
    </div>
  </body>
</html>
