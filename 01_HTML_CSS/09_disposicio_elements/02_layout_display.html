<!DOCTYPE html>
<html lang="ca">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Layout Propietat Display</title>
  <meta name="description" content="Exemple de diferents usos de la propietat display." />
  <link rel="icon" href="./img/favicon.ico" />
  <link rel="stylesheet" href="./css/layout_display.css">
</head>
<body>
  <header>
    <nav>
      <a href="#" class="nav-link">Inici</a>
      <a href="#" class="nav-link">Productes</a>
      <a href="#" class="nav-link">Contacte</a>
    </nav>
  </header>
  <main>
    <section>
      <h2>Benvingut a la nostra botiga!</h2>
      <img src="./img/banner_display_block.png" alt="Banner STEAM CAT videojocs" class="empresa-img">
    </section>
    <section class="productes">
      <h2>Els nostres videojocs destacats</h2>
      <div class="producte display-inline-block">
        <p>Zelda: Breath of the Wild</p>
        <img src="./img/zelda-breath-of-the-wild.jpg" alt="Zelda Breath of the Wild">
      </div>
      <div class="producte display-inline-block">
        <p>Super Smash Bros Ultimate</p>
        <img src="./img/super-smash-btros-ultimate.jpg" alt="Super Smash Bros Ultimate">
      </div>
      <div class="producte display-inline-block">
        <p>Pokémon Legends: ZA</p>
        <img src="./img/pokemon-legends-z-a.jpg" alt="Pokémon Legends Za">
      </div>
    </section>
  </main>
  <footer>
    <span>© Xavi Garcia</span>
    <p class="display-inline"> | </p>
    <p class="display-inline">SteamCAT</p>
    <p class="display-inline">|</p>
    <p class="display-inline">Tots els drets reservats</p>
  </footer>
</body>
</html>
