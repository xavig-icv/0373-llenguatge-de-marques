<!DOCTYPE html>
<html lang="ca">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Propietat Display</title>
    <meta name="description" content="Propietat Visualització d'elements amb diferents exemples.">
    <link rel="icon" href="./img/favicon.ico">
    <link rel="stylesheet" href="./css/propietat_display.css">
  </head>
  <body>
    <h2>Propietat: visualització d'elements (display)</h2>
    <div class="display-block">DIV: Ocupa l'amplada del pare i comença en nova línia. (block)</div>
    <span class="display-inline">SPAN 1 (inline)</span>
    <span class="display-inline">SPAN 2 (inline)</span>
    <div class="display-inline-block">DIV: Amplada definida i es posiciona en línia. (inline-block)
    </div>
    <!-- L'elements amb display: none; no es mostrarà -->
    <div class="display-none">Aquest no es mostrarà.</div>
  </body>
</html>
