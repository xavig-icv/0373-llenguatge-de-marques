<!DOCTYPE html>
<html lang="ca">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Style Set Property - Afegir i Eliminar estils CSS</title>
    <meta name="description"
      content="La funció Style Set Property permet modificar estils CSS d'un element HTML amb JavaScript">
    <link rel="stylesheet" href="./css/6-style-set-property.css">
    <script type="module" src="./js/6-style-set-property.js"></script>
  </head>
  <body>
    <h1>element.style.setProperty()</h1>
    <p>Realitzar canvis simples d'estils CSS d'elements HTML directament des de JavaScript.</p>
    <section>
      <div class="jugador">
        <p>PLAYER COLLIDER</p>
        <img src="./img/mario-normal.webp" alt="mario player">
      </div>
      <div class="jugador power">
        <p>PLAYER POWERUP</p>
        <img src="./img/mario-power.webp" alt="mario powerup">
      </div>
      <div class="jugador dany">
        <p>PLAYER FERIT</p>
        <img src="./img/mario-dany.webp" alt="mario ferit">
      </div>
      <div class="jugador atac">
        <p>PLAYER ATAC</p>
        <img src="./img/mario-atac.webp" alt="mario atac">
      </div>
    </section>
  </body>
</html>
